AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  GrubFleet ERP static portal — private S3 origin + CloudFront (OAC).
  Deploy one stack per tier (staging / preprod / production).

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - staging
      - preprod
      - production
    Description: Deployment tier (matches SAM AppEnv naming)

  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
    Description: CloudFront price class (200 includes India / ap-south-1 viewers)

Resources:
  PortalBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'grubfleet-portal-${Environment}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub 'grubfleet-portal-${Environment}'
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: grubfleet-erp

  PortalOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'grubfleet-portal-oac-${Environment}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
        Description: !Sub 'OAC for grubfleet-portal-${Environment}'

  PortalDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'GrubFleet ERP portal (${Environment})'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: !Ref PriceClass
        Origins:
          - Id: PortalS3Origin
            DomainName: !GetAtt PortalBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt PortalOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: PortalS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Name
          Value: !Sub 'grubfleet-portal-cf-${Environment}'
        - Key: Environment
          Value: !Ref Environment

  PortalBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PortalBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServiceRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${PortalBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${PortalDistribution}'

Outputs:
  PortalBucketName:
    Description: S3 bucket for static Next.js export (sync target)
    Value: !Ref PortalBucket
    Export:
      Name: !Sub 'grubfleet-portal-bucket-${Environment}'

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (invalidation target)
    Value: !Ref PortalDistribution
    Export:
      Name: !Sub 'grubfleet-portal-distribution-id-${Environment}'

  CloudFrontDomainName:
    Description: CloudFront domain (browser origin for CORS ClientOrigin)
    Value: !GetAtt PortalDistribution.DomainName
    Export:
      Name: !Sub 'grubfleet-portal-domain-${Environment}'

  PortalUrl:
    Description: HTTPS portal URL (no trailing slash)
    Value: !Sub 'https://${PortalDistribution.DomainName}'
    Export:
      Name: !Sub 'grubfleet-portal-url-${Environment}'
