name: CI

# Product work: feature/fix/chore → PR → develop (and promotion PRs between long-lived branches).
# CI runs on those PRs and on pushes to long-lived branches after merge.
# See docs/deployment/git-workflow.md

on:
  push:
    branches: [develop, staging, pre-prod, main]
  pull_request:
    branches: [develop, staging, pre-prod, main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grubpac
          POSTGRES_PASSWORD: grubpac_dev
          POSTGRES_DB: grubpac_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grubpac -d grubpac_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      # Use 127.0.0.1 — GitHub Actions service containers often fail on localhost (::1).
      DATABASE_URL: postgresql://grubpac:grubpac_dev@127.0.0.1:5432/grubpac_erp
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
      API_PREFIX: api/v1
      LOG_LEVEL: error
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ci-access-secret-min-32-characters-long!!
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-characters-long!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=optional
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo "Postgres is accepting connections"
              exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready in time"
          exit 1
      - name: Migrate database
        run: npm run db:migrate -w backend
      - name: Lint backend
        run: npm run lint -w backend
      - name: Typecheck backend
        run: npm run typecheck -w backend
      - name: Test backend
        run: npm run test -w backend
      - name: Build backend
        run: npm run build -w backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --include=optional
      - name: Install Tailwind/Lightning native bindings (Linux CI)
        run: |
          npm install --no-save \
            @tailwindcss/oxide-linux-x64-gnu@4.3.3 \
            lightningcss-linux-x64-gnu@1.32.0 \
            -w frontend
      - name: Lint frontend
        run: npm run lint -w frontend
      - name: Typecheck frontend
        run: npm run typecheck -w frontend
      - name: Build frontend
        run: npm run build -w frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
