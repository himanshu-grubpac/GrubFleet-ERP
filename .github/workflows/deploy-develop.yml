name: Deploy Develop (staging tier)

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-aws-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/reusable-container-deploy.yml
    with:
      deploy-label: staging
      github-environment: staging
      branch-ref: develop
    secrets: inherit
