name: Sync fleet-beta branch with pre-prod

# After staging → pre-prod promotion, keep fleet-beta on the same commit and deploy via deploy-fleet-beta.yml.
on:
  push:
    branches: [pre-prod]

# Only the newest pre-prod promotion needs to set fleet-beta parity.
concurrency:
  group: sync-fleet-beta-with-preprod
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-fleet-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align fleet-beta with the promoted pre-prod commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fleet-beta

          # Fleet Beta must contain the exact promoted pre-prod commit. A
          # lease-protected update also repairs a prior Fleet Beta-only commit
          # without overwriting an unexpected concurrent branch update.
          fleet_beta_sha="$(git rev-parse origin/fleet-beta)"
          git push \
            --force-with-lease="refs/heads/fleet-beta:${fleet_beta_sha}" \
            origin "${GITHUB_SHA}:refs/heads/fleet-beta"
