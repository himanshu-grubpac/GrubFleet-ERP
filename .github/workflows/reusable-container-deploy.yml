name: Reusable container deploy

on:
  workflow_call:
    secrets:
      DEPLOY_HEALTH_URL:
        required: false
      DEPLOY_TARGET:
        required: false
    inputs:
      deploy-label:
        description: Short label for tags and artifacts (staging, preprod, production)
        required: true
        type: string
      github-environment:
        description: GitHub Environment name (staging, pre-production, production)
        required: true
        type: string
      branch-ref:
        description: Git ref suffix for image tags (e.g. staging, pre-prod, main)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.out.outputs.backend_image }}
      frontend-image: ${{ steps.out.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: |
          SHA="${GITHUB_SHA::7}"
          echo "sha_tag=${{ inputs.branch-ref }}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "ghcr_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.ghcr_repo }}/backend:${{ steps.vars.outputs.sha_tag }}
            ghcr.io/${{ steps.vars.outputs.ghcr_repo }}/backend:${{ inputs.deploy-label }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.example.com/api/v1' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.ghcr_repo }}/frontend:${{ steps.vars.outputs.sha_tag }}
            ghcr.io/${{ steps.vars.outputs.ghcr_repo }}/frontend:${{ inputs.deploy-label }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image refs
        id: out
        run: |
          echo "backend_image=ghcr.io/${{ steps.vars.outputs.ghcr_repo }}/backend:${{ steps.vars.outputs.sha_tag }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${{ steps.vars.outputs.ghcr_repo }}/frontend:${{ steps.vars.outputs.sha_tag }}" >> "$GITHUB_OUTPUT"

  frontend-portal-s3-cloudfront:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build frontend (static export for S3 + CloudFront)
        run: npm run build -w frontend
        env:
          NEXT_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      - name: Configure AWS credentials (OIDC)
        if: vars.PORTAL_S3_BUCKET != '' && secrets.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Sync static export to S3
        if: vars.PORTAL_S3_BUCKET != '' && secrets.AWS_ROLE_ARN != ''
        run: |
          aws s3 sync apps/frontend/out "s3://${{ vars.PORTAL_S3_BUCKET }}" --delete
      - name: Invalidate CloudFront cache
        if: vars.PORTAL_S3_BUCKET != '' && secrets.AWS_ROLE_ARN != '' && vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
      - name: Upload static export artifact (fallback / audit)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-portal-${{ inputs.deploy-label }}-${{ github.sha }}
          path: apps/frontend/out
          retention-days: 14
      - name: Portal deploy skipped (missing AWS config)
        if: vars.PORTAL_S3_BUCKET == '' || secrets.AWS_ROLE_ARN == ''
        run: |
          echo "Set GitHub Environment secrets/vars to enable S3 sync:"
          echo "  secrets.AWS_ROLE_ARN"
          echo "  vars.PORTAL_S3_BUCKET, vars.CLOUDFRONT_DISTRIBUTION_ID, vars.NEXT_PUBLIC_API_BASE_URL"
          echo "See docs/deployment/s3-cloudfront-portal.md"

  deploy-blue-green:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Blue-green deploy
        id: deploy
        uses: ./.github/actions/blue-green-deploy
        with:
          deploy-label: ${{ inputs.deploy-label }}
          backend-image: ${{ needs.build-and-push.outputs.backend-image }}
          frontend-image: ${{ needs.build-and-push.outputs.frontend-image }}
          health-base-url: ${{ secrets.DEPLOY_HEALTH_URL }}
          deploy-target: ${{ secrets.DEPLOY_TARGET }}
          active-slot-hint: ${{ vars.ACTIVE_SLOT || 'blue' }}

      - name: Post-deploy ACTIVE_SLOT note
        shell: bash
        run: |
          echo "After traffic switch, set GitHub Environment variable ACTIVE_SLOT=${{ steps.deploy.outputs.active-slot }}"
          echo "Drain the previous slot once connections complete (see docs/deployment/blue-green.md)."

  rollback-on-failure:
    needs: deploy-blue-green
    if: failure()
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    steps:
      - name: Rollback placeholder
        shell: bash
        run: |
          echo "Deploy failed — revert traffic to previous ACTIVE_SLOT and redeploy prior image tag."
          echo "Implement rollback via ECS/CodeDeploy or re-run workflow on last known-good SHA."
