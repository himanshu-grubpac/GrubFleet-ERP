name: Reusable container deploy

on:
  workflow_call:
    secrets:
      DEPLOY_HEALTH_URL:
        required: false
      DEPLOY_TARGET:
        required: false
    inputs:
      deploy-label:
        description: Short label for tags and artifacts (staging, preprod, production)
        required: true
        type: string
      github-environment:
        description: GitHub Environment name (staging, pre-production, production)
        required: true
        type: string
      branch-ref:
        description: Git ref suffix for image tags (e.g. staging, pre-prod, main)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  db-migrate:
    if: inputs.deploy-label != 'production'
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure AWS credentials (OIDC)
        if: vars.RDS_MIGRATION_SECURITY_GROUP_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Allow GitHub runner IP on RDS security group
        id: rds_sg
        if: vars.RDS_MIGRATION_SECURITY_GROUP_ID != ''
        env:
          SG_ID: ${{ vars.RDS_MIGRATION_SECURITY_GROUP_ID }}
        run: |
          RUNNER_IP="$(curl -sf --max-time 15 https://checkip.amazonaws.com | tr -d '[:space:]')"
          if [ -z "$RUNNER_IP" ]; then
            echo "Could not resolve runner public IP for RDS ingress."
            exit 1
          fi
          RUNNER_CIDR="${RUNNER_IP}/32"
          echo "runner_cidr=${RUNNER_CIDR}" >> "$GITHUB_OUTPUT"
          echo "Opening PostgreSQL 5432 on ${SG_ID} for ${RUNNER_CIDR} (this job only)."
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 5432 \
            --cidr "$RUNNER_CIDR" \
            || echo "Ingress may already exist; continuing."
          sleep 5
      - name: Install dependencies
        env:
          HUSKY: '0'
          CI: 'true'
        run: npm ci
      - name: Run Drizzle migrations (tier RDS)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CI: 'true'
          RDS_SG_ID: ${{ vars.RDS_MIGRATION_SECURITY_GROUP_ID }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing GitHub Environment secret DATABASE_URL — required for staging/pre-prod migrate."
            exit 1
          fi
          if [ -z "$RDS_SG_ID" ]; then
            echo "Set Environment variable RDS_MIGRATION_SECURITY_GROUP_ID (e.g. sg-0198b9781297f8bf7) so GHA can reach public RDS."
            exit 1
          fi
          npm run db:migrate -w backend
      - name: Revoke runner IP from RDS security group
        if: always() && steps.rds_sg.outputs.runner_cidr != ''
        env:
          SG_ID: ${{ vars.RDS_MIGRATION_SECURITY_GROUP_ID }}
          RUNNER_CIDR: ${{ steps.rds_sg.outputs.runner_cidr }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 5432 \
            --cidr "$RUNNER_CIDR" \
            || echo "Revoke skipped (rule may already be removed)."

  sam-api-deploy:
    needs: db-migrate
    if: always() && (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Install dependencies
        env:
          HUSKY: '0'
          CI: 'true'
        run: npm ci
      - name: Write samconfig from Environment secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          SAM_CLIENT_ORIGIN: ${{ vars.SAM_CLIENT_ORIGIN }}
          CLIENT_ORIGIN: ${{ vars.CORS_ORIGIN }}
          VPC_SUBNET_IDS: ${{ vars.VPC_SUBNET_IDS }}
          VPC_SECURITY_GROUP_IDS: ${{ vars.VPC_SECURITY_GROUP_IDS }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: node scripts/write-samconfig-from-env.mjs ${{ inputs.deploy-label }}
      - name: Prepare Lambda package and deploy SAM stack
        env:
          HUSKY: '0'
          CI: 'true'
        run: |
          npm run prepare:lambda
          node scripts/stage-sam-artifacts.mjs
          node scripts/sam-deploy.mjs ${{ inputs.deploy-label }}

  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.out.outputs.backend_image }}
      frontend-image: ${{ steps.out.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: |
          SHA="${GITHUB_SHA::7}"
          echo "sha_tag=${{ inputs.branch-ref }}-${SHA}" >> "$GITHUB_OUTPUT"
          echo "ghcr_repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.ghcr_repo }}/backend:${{ steps.vars.outputs.sha_tag }}
            ghcr.io/${{ steps.vars.outputs.ghcr_repo }}/backend:${{ inputs.deploy-label }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.example.com/api/v1' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.ghcr_repo }}/frontend:${{ steps.vars.outputs.sha_tag }}
            ghcr.io/${{ steps.vars.outputs.ghcr_repo }}/frontend:${{ inputs.deploy-label }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image refs
        id: out
        run: |
          echo "backend_image=ghcr.io/${{ steps.vars.outputs.ghcr_repo }}/backend:${{ steps.vars.outputs.sha_tag }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${{ steps.vars.outputs.ghcr_repo }}/frontend:${{ steps.vars.outputs.sha_tag }}" >> "$GITHUB_OUTPUT"

  frontend-portal-s3-cloudfront:
    needs: db-migrate
    if: always() && (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build frontend (static export for S3 + CloudFront)
        run: npm run build -w frontend
        env:
          NEXT_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      - name: Configure AWS credentials (OIDC)
        if: vars.PORTAL_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - name: Sync static export to S3
        if: vars.PORTAL_S3_BUCKET != ''
        run: |
          aws s3 sync apps/frontend/out "s3://${{ vars.PORTAL_S3_BUCKET }}" --delete
      - name: Invalidate CloudFront cache
        if: vars.PORTAL_S3_BUCKET != '' && vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
      - name: Upload static export artifact (fallback / audit)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-portal-${{ inputs.deploy-label }}-${{ github.sha }}
          path: apps/frontend/out
          retention-days: 14
      - name: Portal deploy skipped (missing AWS config)
        if: vars.PORTAL_S3_BUCKET == ''
        run: |
          echo "Set GitHub Environment secrets/vars to enable S3 sync:"
          echo "  secrets.AWS_ROLE_ARN"
          echo "  vars.PORTAL_S3_BUCKET, vars.CLOUDFRONT_DISTRIBUTION_ID, vars.NEXT_PUBLIC_API_BASE_URL"
          echo "See docs/deployment/s3-cloudfront-portal.md"

  deploy-blue-green:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Blue-green deploy
        id: deploy
        uses: ./.github/actions/blue-green-deploy
        with:
          deploy-label: ${{ inputs.deploy-label }}
          backend-image: ${{ needs.build-and-push.outputs.backend-image }}
          frontend-image: ${{ needs.build-and-push.outputs.frontend-image }}
          health-base-url: ${{ secrets.DEPLOY_HEALTH_URL }}
          deploy-target: ${{ secrets.DEPLOY_TARGET }}
          active-slot-hint: ${{ vars.ACTIVE_SLOT || 'blue' }}

      - name: Post-deploy ACTIVE_SLOT note
        shell: bash
        run: |
          echo "After traffic switch, set GitHub Environment variable ACTIVE_SLOT=${{ steps.deploy.outputs.active-slot }}"
          echo "Drain the previous slot once connections complete (see docs/deployment/blue-green.md)."

  rollback-on-failure:
    needs: deploy-blue-green
    if: failure()
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    steps:
      - name: Rollback placeholder
        shell: bash
        run: |
          echo "Deploy failed — revert traffic to previous ACTIVE_SLOT and redeploy prior image tag."
          echo "Implement rollback via ECS/CodeDeploy or re-run workflow on last known-good SHA."
