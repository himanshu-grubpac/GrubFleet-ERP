version = 0.1

[default.deploy.parameters]
stack_name = "grubfleet-api-preprod"
resolve_s3 = true
s3_prefix = "grubfleet-api-preprod"
region = "ap-south-1"
confirm_changeset = false
capabilities = "CAPABILITY_IAM"
disable_rollback = false
profile = "grubfleet-erp"
image_repositories = []
# Copy to samconfig.preprod.toml (gitignored) and replace REPLACE_ME values.
parameter_overrides = "ApiFunctionName=\"grubfleet-api-preprod\" AppEnv=\"preprod\" ClientOrigin=\"REPLACE_ME_FRONTEND_ORIGIN\" DatabaseUrl=\"REPLACE_ME\" RedisUrl=\"REPLACE_ME\" JwtAccessSecret=\"REPLACE_ME_PREPROD_ACCESS_MIN_32_CHARS\" JwtRefreshSecret=\"REPLACE_ME_PREPROD_REFRESH_MIN_32_CHARS\" JwtAccessTtl=\"15m\" JwtRefreshTtl=\"7d\" LogLevel=\"info\" EnableWarmupSchedule=\"true\" ReservedConcurrency=10"

[default.global.parameters]
region = "ap-south-1"
profile = "grubfleet-erp"
