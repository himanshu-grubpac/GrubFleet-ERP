    post:
      tags: [fleet-leasing]
      summary: Create draft lease contract
      description: >-
        Explicit draft save only (wizard Save draft or batch create before confirm).
        Optional body fields mirror PATCH update. Asset lines on create reject shortfall
        unless confirmShortfall is true (409 ASSET_SHORTFALL otherwise — same as PUT asset-lines).
        Confirm step still validates allocation before activate.
      operationId: createLeaseContract
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId]
              properties:
                organizationId:
                  type: string
                  format: uuid
                clientId:
                  type: string
                  format: uuid
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                termMonths:
                  type: integer
                  minimum: 1
                securityDeposit:
                  type: string
                  pattern: '^\\d{1,12}(\\.\\d{1,2})?$'
                billingFrequency:
                  type: string
                  enum: [monthly, quarterly, annual]
                additionalTerms:
                  type: string
                  maxLength: 2000
                amcTier:
                  type: string
                  maxLength: 120
                  enum: [Gold, Silver, Bronze]
                description:
                  type: string
                  maxLength: 2000
                confirmShortfall:
                  type: boolean
                assetLines:
                  type: array
                  items:
                    type: object
                    required: [assetClass, committedQuantity, ratePerVehicleMonth]
                    properties:
                      assetClass:
                        type: string
                        maxLength: 64
                      committedQuantity:
                        type: integer
                        minimum: 1
                      ratePerVehicleMonth:
                        type: string
                        pattern: '^\\d{1,12}(\\.\\d{1,2})?$'
                vehicleIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '201':
          description: Created draft contract
        '400':
          description: Validation error (e.g. INVALID_CLIENT, CONTRACT_DATE_TERM_MISMATCH)
        '409':
          description: ASSET_SHORTFALL when lines exceed availability without confirmShortfall
        '403':
          $ref: '#/components/responses/Forbidden'
