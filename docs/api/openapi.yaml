            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [activate, deactivate]
                reason:
                  type: string
                  maxLength: 500
                  description: Required when action is deactivate
      responses:
        '200':
          description: Status updated
        '400':
          description: Missing deactivate reason or invalid transition
  /asset-register/vehicles:
    get:
      tags: [asset-register]
      summary: List fleet register vehicles (paginated)
      description: >-
        fleetCode, registrationNumber, asset class name, odometer, operationalStatus.
        Filter by assetClassId, operationalStatus, lifecycle status (active/inactive), or search.
      operationId: listAssetRegisterVehicles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, fleetCode, registrationNumber, operationalStatus, updatedAt]
        - $ref: '#/components/parameters/SortOrderParam'
        - name: assetClassId
          in: query
          schema:
            type: string
            format: uuid
        - name: operationalStatus
          in: query
          schema:
            type: string
            enum: [available, leased, workshop, sold, retired]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: search
          in: query
          schema:
            type: string
          description: Partial match on fleet code, registration number, or asset class name
        - name: demandFilter
          in: query
          schema:
            type: string
            enum: [any, in_demand, no_demand]
          description: >-
            Filter by open lease demand on the vehicle asset class (unallocated
            quantity on in-flight contract lines). Default any.
        - name: includeAssignmentSummary
          in: query
          schema:
            type: boolean
          description: >-
            When true, response includes assignmentSummary with org-wide
            openDemandUnits and openDemandContractCount (assignment empty state).
      responses:
        '200':
          description: >-
            Paginated fleet register vehicles. List items include chassisNumber,
            addedToRegisterDate (ISO date), openDemandUnitsToAssign and
            openDemandContractCount (per vehicle asset class, same value for all
            vehicles sharing a class). Optional assignmentSummary when
            includeAssignmentSummary=true.
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      tags: [asset-register]
      summary: Register a vehicle (fleetCode server-generated)
      operationId: createAssetRegisterVehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRegisterVehicleRequest'
      responses:
        '201':
          description: Created vehicle with VH- sequence fleetCode
        '400':
          description: Validation error or inactive class/master
        '403':
          description: Forbidden
        '409':
          description: Registration number already exists in the organisation
  /asset-register/vehicles/{id}:
    get:
      tags: [asset-register]
      summary: Fleet register vehicle detail
      operationId: getAssetRegisterVehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vehicle with class and master names
        '404':
          description: Not found
    patch:
      tags: [asset-register]
      summary: Update fleet register vehicle
      operationId: updateAssetRegisterVehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetRegisterVehicleRequest'
      responses:
        '200':
          description: Updated vehicle
        '400':
          description: Inactive vehicle or validation error
        '409':
          description: Registration number already exists in the organisation
  /asset-register/vehicles/{id}/lease-history:
    get:
      tags: [asset-register]
      summary: Lease assignment history for a fleet register vehicle
      operationId: getAssetRegisterVehicleLeaseHistory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assignment rows with contract summary (lessee, dates, status)
        '404':
          description: Vehicle not found
  /asset-register/vehicles/{id}/status:
    patch:
      tags: [asset-register]
      summary: Activate or deactivate fleet register vehicle
      operationId: updateAssetRegisterVehicleStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [activate, deactivate]
                reason:
                  type: string
                  maxLength: 500
                  description: Required when action is deactivate
      responses:
        '200':
          description: Status updated
        '400':
          description: Missing deactivate reason or invalid transition
  /asset-register/vehicle-assignments/assignable-lease-contracts:
    get:
      tags: [asset-register]
      summary: List lease contracts assignable to a fleet register vehicle (by asset class line)
      operationId: listAssignableLeaseContractsForVehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: vehicleId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: search
          in: query
          schema:
            type: string
            maxLength: 64
        - name: organisationClientId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: >-
            Paginated contracts with matching asset class lines; assignable false when fully allocated or not active.
            hiddenOtherActiveCount counts active contracts without this asset class line.
        '404':
          description: Vehicle not found in organization
  /asset-register/vehicle-assignments/assignable-lease-contracts:
    get:
      tags: [asset-register]
      summary: List lease contracts for vehicle assignment (by asset class line)
      operationId: listAssignableLeaseContractsForVehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: vehicleId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: search
          in: query
          schema:
            type: string
            maxLength: 64
        - name: organisationClientId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: >-
            Paginated contracts with lines for the vehicle asset class;
            hasMatchingContractLine false when no contract includes the class;
            hiddenOtherActiveCount counts active contracts without this class.
        '404':
          description: Vehicle not found
  /asset-register/vehicle-assignments/bulk-assign/catalog:
    get:
      tags: [asset-register]
      summary: Bulk assign wizard catalog — clients with open asset-class lines; contracts when organisationClientId is set
      operationId: getBulkAssignCatalog
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: organisationClientId
          in: query
          schema:
            type: string
            format: uuid
          description: When set, includes active contracts and per-line capacity for the client
      responses:
        '200':
          description: Client summaries; optional contracts with asset lines, allocation, and available register counts
  /asset-register/vehicle-assignments/bulk-assign/validate:
    post:
      tags: [asset-register]
      summary: Pre-submit validation for bulk assign selection
      operationId: validateBulkAssignAssetRegisterVehicles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, leaseContractId, vehicleIds]
              properties:
                organizationId:
                  type: string
                  format: uuid
                leaseContractId:
                  type: string
                  format: uuid
                vehicleIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
                    format: uuid
                assetClassId:
                  type: string
                  format: uuid
                  description: Optional; used for replacement pool count
      responses:
        '200':
          description: Per-vehicle availability and replacement pool hint
          content:
            application/json:
              schema:
                type: object
                required:
                  - leaseContractId
                  - vehicles
                  - conflictCount
                  - replacementAvailableCount
                  - allAvailable
                properties:
                  leaseContractId:
                    type: string
                    format: uuid
                  conflictCount:
                    type: integer
                    minimum: 0
                  replacementAvailableCount:
                    type: integer
                    minimum: 0
                  allAvailable:
                    type: boolean
                  vehicles:
                    type: array
                    items:
                      type: object
                      required: [vehicleId, fleetCode, available]
                      properties:
                        vehicleId:
                          type: string
                          format: uuid
                        fleetCode:
                          type: string
                        available:
                          type: boolean
                        reason:
                          type: string
                          enum:
                            - assigned_elsewhere
                            - in_workshop
                            - inactive
                            - not_available
                            - wrong_asset_class
                        conflictLabel:
                          type: string
                          nullable: true
  /asset-register/vehicle-assignments/bulk-assign:
    post:
      tags: [asset-register]
      summary: Bulk assign fleet register vehicles to an active lease contract
      operationId: bulkAssignAssetRegisterVehicles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, leaseContractId, vehicleIds]
              properties:
                organizationId:
                  type: string
                  format: uuid
                leaseContractId:
                  type: string
                  format: uuid
                organisationClientId:
                  type: string
                  format: uuid
                  description: >-
                    Organisation client id, or fleet client id from lease detail client.id
                    (resolved via fleet_clients.organisation_client_id when linked).
                    Omitted when the lease fleet client is linked — server resolves the org client.
                vehicleIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
                    format: uuid
                handoverDate:
                  type: string
                  format: date
                  description: Handover calendar date; sets assignment assignedAt when provided
                odometerAtHandover:
                  type: integer
                  minimum: 0
                  description: Updates fleet register vehicle odometer when provided
                handoverLocation:
                  type: string
                  maxLength: 255
                  description: Handover depot or location label stored on each assignment
                notes:
                  type: string
                  maxLength: 2000
                  description: Optional batch notes stored on each assignment
      responses:
        '200':
          description: Assignments recorded; vehicles operationalStatus set to leased
          content:
            application/json:
              schema:
                type: object
                required:
                  - leaseContractId
                  - contractId
                  - contractNumber
                  - clientName
                  - assetClassName
                  - handoverDate
                  - lineCommitted
                  - lineAllocatedAfter
                  - remainingToAssignOnLine
                  - remainingInPoolForClass
                  - fullyAssignedLine
                  - assignedCount
                  - assignments
                properties:
                  leaseContractId:
                    type: string
                    format: uuid
                  contractId:
                    type: string
                    format: uuid
                    description: Same as leaseContractId (portal navigation)
                  contractNumber:
                    type: string
                  clientName:
                    type: string
                  assetClassName:
                    type: string
                  handoverDate:
                    type: string
                    format: date
                  lineCommitted:
                    type: integer
                    minimum: 0
                  lineAllocatedAfter:
                    type: integer
                    minimum: 0
                  remainingInPoolForClass:
                    type: integer
                    minimum: 0
                  fullyAssignedLine:
                    type: boolean
                  remainingToAssignOnLine:
                    type: integer
                    minimum: 0
                    description: Unallocated units on the primary asset line after this assign
                  fleetCode:
                    type: string
                    nullable: true
                    description: Set when exactly one vehicle was assigned
                  assignedCount:
                    type: integer
                    minimum: 0
                  assignments:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        vehicleId:
                          type: string
                          format: uuid
                        leaseContractId:
                          type: string
                          format: uuid
                        fleetClientId:
                          type: string
                          format: uuid
                          nullable: true
                        organisationClientId:
                          type: string
                          format: uuid
                          nullable: true
                        assignedAt:
                          type: string
                          format: date-time
        '400':
          description: >-
            NO_ACTIVE_LEASE_CONTRACT, LEASE_CAPACITY_SHORTFALL,
            ORGANISATION_CLIENT_MISMATCH, ORGANISATION_CLIENT_NOT_FOUND,
            FLEET_CLIENT_ORGANISATION_LINK_MISSING, or LEASE_FLEET_CLIENT_NOT_FOUND
        '409':
          description: >-
            BULK_ASSIGN_VEHICLE_CONFLICT — one or more vehicles no longer assignable;
            details.vehicles lists per-vehicle reason (no partial assign)
  /asset-register/vehicle-assignments/{vehicleId}/unassign:
    patch:
      tags: [asset-register]
      summary: Unassign vehicle from active lease assignment
      operationId: unassignAssetRegisterVehicle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assignment closed; operationalStatus available
        '400':
          description: NO_ACTIVE_ASSIGNMENT
  /asset-register/compliance:
    get:
      tags: [asset-register]
      summary: Compliance list (insurance, registration, warranty)
      operationId: listAssetRegisterCompliance
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [registrationNumber, fleetCode, complianceDueDate]
        - $ref: '#/components/parameters/SortOrderParam'
        - name: complianceStatus
          in: query
          schema:
            type: string
            enum: [all, expired, expiring_soon, valid]
        - name: assetClassId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated compliance rows derived from vehicle date fields
  /asset-register/compliance/{vehicleId}:
    get:
      tags: [asset-register]
      summary: Compliance detail for a vehicle
      operationId: getAssetRegisterComplianceDetail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vehicle summary with compliance buckets
  /asset-register/compliance/{vehicleId}/renew:
    post:
      tags: [asset-register]
      summary: Renew insurance, registration, or warranty on a vehicle
      operationId: renewAssetRegisterCompliance
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, type, startDate, endDate]
              properties:
                organizationId:
                  type: string
                  format: uuid
                type:
                  type: string
                  enum: [insurance, registration, warranty]
                startDate:
                  $ref: '#/components/schemas/StrictIsoDateString'
                endDate:
                  $ref: '#/components/schemas/StrictIsoDateString'
                insurancePremium:
                  allOf:
                    - $ref: '#/components/schemas/DecimalMoneyString'
                  description: Required when type is insurance
      responses:
        '200':
          description: Updated compliance detail
        '400':
          description: Validation or inactive vehicle
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    SortOrderParam:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
      description: Sort direction when sortBy is set. Defaults to module-specific order when omitted.
    OrganizationIdQuery:
      name: organizationId
      in: query
      required: true
      description: >-
        Organization UUID for org-scoped routes. Alternatively (or additionally)
        send `X-Organization-Id`; the header is preferred when both are present.
        POST bodies may include `organizationId` instead of query/header where documented.
      schema:
        type: string
        format: uuid
    OrganizationIdHeader:
      name: X-Organization-Id
      in: header
      required: false
      description: >-
        Organization UUID when not using `organizationId` query (or body on POST).
        Required for org context if query/body org id is omitted.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Permission or organization access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    HealthLiveness:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: grubpac-erp-backend
    HealthReadiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          example: ready
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [up, down]
          example:
            database: up
            redis: up
            drizzle: up
    StrictIsoDateString:
      type: string
      format: date
      description: >-
        ISO 8601 calendar date (YYYY-MM-DD) only. Strict validation rejects
        datetime strings with a time component (e.g. 2026-01-15T00:00:00Z).
      example: '2026-01-15'
    DecimalMoneyString:
      type: string
      pattern: '^\d{1,12}(\.\d{1,2})?$'
      description: >-
        Decimal amount string with up to 12 integer digits and optional 2
        decimal places (asset insurance premium, lease decimal amounts).
      example: '12000.00'
    OptionalGstin:
      type: string
      maxLength: 32
      description: Optional GSTIN / tax ID (15-character Indian GSTIN when provided).
      pattern: '^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$'
    CompactE164Phone:
      type: string
      maxLength: 32
      description: >-
        Compact international phone (E.164 or digits). Validated with
        libphonenumber-js at the API boundary.
      example: '+919876543210'
    CreateOrganisationLocationTypeRequest:
      type: object
      required:
        - organizationId
        - name
      properties:
        organizationId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
    CreateOrganisationEmployeeRequest:
      type: object
      required:
        - organizationId
        - fullName
        - designation
        - department
        - locationId
        - employmentType
        - dateOfJoining
        - phone
        - email
      properties:
        organizationId:
          type: string
          format: uuid
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        designation:
          type: string
          minLength: 1
          maxLength: 255
        department:
          type: string
          minLength: 1
          maxLength: 120
        branchLocationLabel:
          type: string
          maxLength: 255
        locationId:
          type: string
          format: uuid
        reportsToEmployeeId:
          type: string
          format: uuid
        employmentType:
          type: string
          enum: [full_time, part_time, contract]
        dateOfJoining:
          type: string
          format: date
        phone:
          type: string
          minLength: 1
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 320
    UpdateOrganisationEmployeeRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        designation:
          type: string
          maxLength: 255
        department:
          type: string
          maxLength: 120
        branchLocationLabel:
          type: string
          maxLength: 255
        locationId:
          type: string
          format: uuid
          nullable: true
        reportsToEmployeeId:
          type: string
          format: uuid
          nullable: true
        employmentType:
          type: string
          enum: [full_time, part_time, contract]
        dateOfJoining:
          type: string
          format: date
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 320
    CreateOrganisationLocationRequest:
      type: object
      required:
        - organizationId
        - name
        - locationTypeId
        - addressLine1
        - addressCountry
        - addressState
        - addressDistrict
        - addressPincode
      properties:
        organizationId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        locationTypeId:
          type: string
          format: uuid
        addressLine1:
          type: string
          maxLength: 255
        addressLine2:
          type: string
          maxLength: 255
        addressCity:
          type: string
          maxLength: 120
        addressCountry:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^[A-Za-z]{2}$'
          description: >-
            ISO 3166-1 alpha-2 country code (validated against maintained ISO
            dataset; all assigned codes accepted)
          example: IN
        addressState:
          type: string
          maxLength: 120
        addressDistrict:
          type: string
          maxLength: 120
        addressPincode:
          type: string
          maxLength: 20
          description: Postal code; format validated per addressCountry (IN 6-digit, US ZIP, etc.)
        siteContactPhone:
          type: string
          maxLength: 32
        siteContactEmail:
          type: string
          format: email
          maxLength: 320
        responsibleEmployeeId:
          type: string
          format: uuid
        deputyEmployeeId:
          type: string
          format: uuid
    UpdateOrganisationLocationRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        locationTypeId:
          type: string
          format: uuid
        addressLine1:
          type: string
          maxLength: 255
        addressLine2:
          type: string
          maxLength: 255
        addressCity:
          type: string
          maxLength: 120
        addressCountry:
          type: string
          minLength: 2
          maxLength: 2
          pattern: '^[A-Za-z]{2}$'
          description: ISO 3166-1 alpha-2 country code (maintained ISO dataset)
        addressState:
          type: string
          maxLength: 120
        addressDistrict:
          type: string
          maxLength: 120
        addressPincode:
          type: string
          maxLength: 20
        siteContactPhone:
          type: string
          maxLength: 32
        siteContactEmail:
          type: string
          format: email
          maxLength: 320
        responsibleEmployeeId:
          type: string
          format: uuid
          nullable: true
        deputyEmployeeId:
          type: string
          format: uuid
          nullable: true
    AssetRegisterAssetClassListItem:
      type: object
      required:
        - id
        - classId
        - name
        - specLabel
        - vehicleType
        - fuelType
        - inFleetCount
        - availableCount
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Internal stable identifier for APIs and FKs (lease assetClassId, vehicles).
        classId:
          type: string
          pattern: '^[0-9]{6}$'
          description: Org-unique 6-digit display class identifier (server-assigned on create).
        name:
          type: string
          description: System-generated class name from spec fields (read-only).
        specLabel:
          type: string
          description: Human-readable spec summary for dropdowns and tooltips.
