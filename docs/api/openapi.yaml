          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        moduleAccess:
          type: array
          items:
            $ref: '#/components/schemas/ModuleAccessEntry'
        permissionKeys:
          type: array
          items:
            type: string
          description: >-
            Alternate contract; ignored when moduleAccess is set. Server expands
            implied keys before save (create/update/delete/manage imply view for the
            same module; manage implies view plus create, update, and delete).
        parentRoleId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Parent role UUID in the same organization (must be visible to the actor).
            Omit or null for a hierarchy root (requires administration.manage).
