          type: array
          items:
            $ref: '#/components/schemas/ModuleAccessEntry'
        permissionKeys:
          type: array
          items:
            type: string
          description: >-
            Explicit keys; server expands implied view/CRUD keys per module before save
            (same rules as CreateRoleRequest.permissionKeys).
        isActive:
          type: boolean
        parentRoleId:
          type: string
          format: uuid
          nullable: true
          description: >-
            New parent role UUID (same org, visible to actor), or null to clear parent
            and make this role a hierarchy root (requires administration.manage).
