      summary: Edit contract (client, terms, asset lines, vehicles)
      description: |
        Single payload edit for non-closed contracts. Allowed raw statuses include
        draft, pending_approval, approved, active, awaiting_assets, deactivated,
        and billing_paused. Blocked on closed, concluded, and pending_termination.
        When startDate or termMonths change, endDate is recomputed from start + term.
        Terms or asset-line rate changes refresh rateRequiresApproval in place (no auto status demotion).
      operationId: updateLeaseContract
