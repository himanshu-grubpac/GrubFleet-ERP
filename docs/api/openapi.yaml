        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeaseContractBody'
            example:
              clientId: "11111111-1111-4111-8111-111111111111"
              startDate: "2026-09-15"
              termMonths: 24
              securityDeposit: "96000.00"
              billingFrequency: monthly
              additionalTerms: "Standard fleet SLA applies."
              amcTier: "Gold"
              assetLines:
                - assetClass: Sedan
                  committedQuantity: 10
                  ratePerVehicleMonth: "34500.00"
      responses:
        '200':
          description: Updated contract detail; pricingEvaluation when terms or lines changed
          content:
