services:
  postgres:
    image: postgres:16-alpine
    container_name: grubpac-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: grubpac
      POSTGRES_PASSWORD: grubpac_dev
      POSTGRES_DB: grubpac_erp
    ports:
      - "5432:5432"
    volumes:
      - grubpac_erp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grubpac -d grubpac_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: grubpac-erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - grubpac_erp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  grubpac_erp_pg_data:
  grubpac_erp_redis_data:
