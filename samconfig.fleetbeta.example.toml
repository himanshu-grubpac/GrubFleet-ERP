version = 0.1

[default.deploy.parameters]
stack_name = "grubfleet-api-fleetbeta"
resolve_s3 = true
s3_prefix = "grubfleet-api-fleetbeta"
region = "ap-south-1"
confirm_changeset = false
capabilities = "CAPABILITY_IAM"
disable_rollback = false
profile = "grubfleet-erp"
image_repositories = []
# Copy to samconfig.fleetbeta.toml (gitignored) and replace REPLACE_ME values.
# Database: grubfleet_erp_fleet_beta on shared grubpac-v2 (see docs/deployment/fleet-beta-bootstrap.md).
parameter_overrides = "ApiFunctionName=\"grubfleet-api-fleetbeta\" AppEnv=\"fleetbeta\" ClientOrigin=https://REPLACE_CLOUDFRONT_DOMAIN,http://localhost:3000 DatabaseUrl=\"REPLACE_ME\" RedisUrl=\"REPLACE_ME\" JwtAccessSecret=\"REPLACE_ME_FLEETBETA_ACCESS_MIN_32_CHARS\" JwtRefreshSecret=\"REPLACE_ME_FLEETBETA_REFRESH_MIN_32_CHARS\" JwtAccessTtl=\"15m\" JwtRefreshTtl=\"7d\" LogLevel=\"info\" EnableWarmupSchedule=\"true\" ReservedConcurrency=0"

[default.global.parameters]
region = "ap-south-1"
profile = "grubfleet-erp"
