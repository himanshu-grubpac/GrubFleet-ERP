version = 0.1

[default.deploy.parameters]
stack_name = "grubfleet-api-production"
resolve_s3 = true
s3_prefix = "grubfleet-api-production"
region = "ap-south-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
disable_rollback = false
profile = "grubfleet-erp"
image_repositories = []
# Copy to samconfig.production.toml (gitignored) and replace REPLACE_ME values.
# AppEnv=production requires JWT secrets per env.schema.ts.
parameter_overrides = "ApiFunctionName=\"grubfleet-api-production\" AppEnv=\"production\" ClientOrigin=\"REPLACE_ME_FRONTEND_ORIGIN\" DatabaseUrl=\"REPLACE_ME\" RedisUrl=\"REPLACE_ME\" JwtAccessSecret=\"REPLACE_ME_PROD_ACCESS_MIN_32_CHARS\" JwtRefreshSecret=\"REPLACE_ME_PROD_REFRESH_MIN_32_CHARS\" JwtAccessTtl=\"15m\" JwtRefreshTtl=\"7d\" LogLevel=\"info\" EnableWarmupSchedule=\"true\" ReservedConcurrency=40"

[default.global.parameters]
region = "ap-south-1"
profile = "grubfleet-erp"
